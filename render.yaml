services:
  - type: web
    name: bingo-agents-bot
    env: python
    envVars:
      - key: CARGO_HOME
        value: /tmp/cargo
      - key: PIP_DEFAULT_TIMEOUT
        value: "100"
    buildCommand: mkdir -p /tmp/cargo && pip install --upgrade pip && pip install --no-cache-dir --timeout=100 -r requirements.txt
    startCommand: python agents.py
    plan: free